version: '3.8'

services:
  scam-detector:
    build: .
    container_name: scam_detector_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - SECRET_KEY=scam-detector-dev-key-change-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
